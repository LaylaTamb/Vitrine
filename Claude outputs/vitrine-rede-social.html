<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vitrine — proposta de rede social</title>
<!--
  Protótipo navegável da PROPOSTA de reorganização do Vitrine como rede social.
  Nada aqui grava dados. Mantém a identidade (Fraunces itálico, roxo, modo escuro).
  Precisa de internet (Tailwind, fontes, ícones e fotos de exemplo).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-display: "Fraunces", ui-serif, Georgia, serif;

    --color-bg: #121214;
    --color-bg-soft: #16161a;
    --color-surface: #1b1b1f;
    --color-surface-hi: #232328;
    --color-line: #2a2a31;
    --color-line-hi: #3a3a43;

    --color-ink: #ececef;
    --color-foreground: #ececef;
    --color-muted-foreground: #9d9da8;
    --color-faint: #6e6e78;

    --color-brand: #b98cc2;
    --color-brand-dim: #8e6c96;
    --color-brand-wash: rgb(185 140 194 / 0.14);
    --color-brand-glow: rgb(185 140 194 / 0.3);
    --color-danger: #d08585;
    --color-ok: #8fc9a6;
    --color-on-brand: #1a1220;
  }

  @layer base {
    html { color-scheme: dark; }
    body { @apply bg-bg font-sans text-ink antialiased; }
    ::selection { background: var(--color-brand-wash); }
    *:focus-visible { outline: 2px solid var(--color-brand-dim); outline-offset: 2px; }
    button, a, [data-go] { -webkit-tap-highlight-color: transparent; }
  }

  @layer components {
    .plaque { font-size: .68rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--color-faint); }
    .display { font-family: var(--font-display); font-style: italic; font-weight: 400; }

    .card { @apply rounded-2xl border border-line bg-surface; }
    .card-hover { @apply transition-colors hover:border-line-hi; }

    .btn { @apply inline-flex shrink-0 cursor-pointer items-center justify-center gap-1.5 rounded-xl border border-transparent text-sm font-medium whitespace-nowrap transition-all select-none; }
    .btn svg { @apply size-4; }
    .btn-md { @apply h-9 px-3.5; }
    .btn-sm { @apply h-8 px-3 text-[0.8rem]; }
    .btn-sm svg { @apply size-3.5; }
    .btn-primary { @apply bg-brand text-on-brand hover:brightness-110; }
    .btn-soft { @apply bg-surface-hi text-ink hover:bg-line; }
    .btn-outline { @apply border-line text-ink hover:bg-surface-hi; }
    .btn-ghost { @apply text-muted-foreground hover:bg-surface-hi hover:text-ink; }

    .icon-btn { @apply relative flex size-10 cursor-pointer items-center justify-center rounded-xl text-muted-foreground transition-colors hover:bg-surface-hi hover:text-ink; }
    .dot { @apply absolute top-2 right-2 size-2 rounded-full bg-brand ring-2 ring-bg; }

    .input { @apply h-10 w-full rounded-xl border border-line bg-bg-soft px-3.5 text-sm text-ink outline-none placeholder:text-faint focus:border-brand-dim; }
    .chip { @apply inline-flex shrink-0 cursor-pointer items-center gap-1.5 rounded-full border border-line px-3 py-1.5 text-sm text-muted-foreground transition-colors hover:border-line-hi hover:text-ink; }
    .chip[aria-pressed="true"] { @apply border-brand-dim bg-brand-wash text-ink; }

    .tabs { @apply flex gap-1 border-b border-line; }
    .tab { @apply -mb-px cursor-pointer border-b-2 border-transparent px-3 py-2.5 text-sm text-muted-foreground transition-colors hover:text-ink; }
    .tab[aria-selected="true"] { @apply border-brand text-ink; }

    .segmented { @apply inline-flex items-center gap-0.5 rounded-xl border border-line bg-surface p-0.5; }
    .segmented > * { @apply flex h-8 cursor-pointer items-center gap-1.5 rounded-lg px-2.5 text-xs text-muted-foreground; }
    .segmented > [aria-pressed="true"] { @apply bg-brand-wash text-ink; }

    .avatar { @apply inline-flex shrink-0 items-center justify-center rounded-full leading-none; font-family: var(--font-display); font-style: italic; }
    .ring-new { box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-brand); }

    .nav-item { @apply flex cursor-pointer items-center gap-3 rounded-xl px-3 py-2.5 text-[0.95rem] text-muted-foreground transition-colors hover:bg-surface-hi hover:text-ink; }
    .nav-item[aria-current="true"] { @apply bg-brand-wash text-ink; }
    .nav-item[aria-current="true"] svg { @apply text-brand; }

    .tabbar-item { @apply flex flex-1 cursor-pointer flex-col items-center justify-center gap-1 py-2 text-[0.65rem] text-muted-foreground; }
    .tabbar-item[aria-current="true"] { @apply text-ink; }
    .tabbar-item[aria-current="true"] svg { @apply text-brand; }

    .glow { position: absolute; inset: 12% 10% 6%; background: var(--color-brand-glow); filter: blur(26px); opacity: .45; pointer-events: none; }
    .scroll-x { @apply -mx-4 flex gap-3 overflow-x-auto px-4 py-1.5; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }
    .new-badge { @apply rounded-full bg-brand px-1.5 py-px text-[0.6rem] font-semibold tracking-wide text-on-brand uppercase; }
  }
</style>
</head>

<body>
  <!-- ===== Barra do protótipo (não é o app) ===== -->
  <div id="proto-bar" class="sticky top-0 z-[60] border-b border-dashed border-brand-dim bg-[#0b0b0d] text-xs">
    <div class="mx-auto flex max-w-[1280px] flex-wrap items-center gap-2 px-4 py-2">
      <span class="plaque text-brand">Proposta · protótipo</span>
      <select id="screen-select" class="h-8 rounded-lg border border-line bg-surface px-2 text-xs text-ink">
        <option value="inicio">Início (feed)</option>
        <option value="descobrir">Descobrir</option>
        <option value="match">Match</option>
        <option value="match-lucas">Match com Lucas</option>
        <option value="perfil">Meu perfil</option>
        <option value="pessoa-ana">Perfil de uma amiga</option>
        <option value="categoria">Categoria</option>
        <option value="item">Item</option>
        <option value="avisos">Avisos</option>
        <option value="config">Configurações</option>
        <option value="editar">Editar perfil</option>
      </select>
      <button id="notes-toggle" class="flex h-8 items-center gap-1.5 rounded-lg border border-line px-2.5 text-ink hover:bg-surface-hi">
        <i data-lucide="lightbulb" class="size-3.5 text-brand"></i> O que mudou aqui
      </button>
      <div class="segmented ml-auto">
        <button data-device="desktop" aria-pressed="true"><i data-lucide="monitor" class="size-3.5"></i> Computador</button>
        <button data-device="mobile"><i data-lucide="smartphone" class="size-3.5"></i> Celular</button>
      </div>
    </div>
    <div id="notes" class="hidden border-t border-line">
      <div class="mx-auto max-w-[1280px] px-4 py-3 text-sm leading-relaxed text-muted-foreground"></div>
    </div>
  </div>

  <div id="phone-wrap" class="hidden justify-center py-6">
    <iframe id="phone" title="Vitrine no celular" class="h-[844px] w-[390px] rounded-[2.2rem] border-8 border-[#2a2a31] bg-bg"></iframe>
  </div>

  <!-- ===== O app ===== -->
  <div id="app" class="min-h-dvh md:flex">
    <!-- Lateral (computador e tablet) -->
    <aside class="sticky top-0 hidden h-dvh w-20 shrink-0 flex-col border-r border-line px-3 py-5 md:flex lg:w-64">
      <a data-go="inicio" class="mb-6 flex cursor-pointer items-center gap-2 px-3">
        <span class="size-2.5 rounded-full bg-brand" style="box-shadow:0 0 12px 2px var(--color-brand-glow)"></span>
        <span class="display hidden text-2xl leading-none lg:inline">Vitrine</span>
      </a>
      <nav class="flex flex-col gap-1" id="side-nav"></nav>
      <button data-sheet="adicionar" class="btn btn-md btn-primary mt-4 w-full"><i data-lucide="plus"></i><span class="hidden lg:inline">Adicionar</span></button>
      <a data-go="config" data-nav="config" class="nav-item mt-auto"><i data-lucide="settings" class="size-5"></i><span class="hidden lg:inline">Configurações</span></a>
    </aside>

    <div class="min-w-0 flex-1">
      <!-- Topo (celular) -->
      <header class="sticky top-0 z-40 flex h-14 items-center justify-between border-b border-line px-4 md:hidden" style="background:rgba(18,18,20,.88);backdrop-filter:blur(12px)">
        <a data-go="inicio" class="flex cursor-pointer items-center gap-2">
          <span class="size-2 rounded-full bg-brand" style="box-shadow:0 0 10px 1px var(--color-brand-glow)"></span>
          <span class="display text-xl leading-none">Vitrine</span>
        </a>
        <div class="flex items-center">
          <button data-go="descobrir" class="icon-btn" title="Buscar"><i data-lucide="search" class="size-5"></i></button>
          <button data-go="avisos" class="icon-btn" title="Avisos"><i data-lucide="bell" class="size-5"></i><span class="dot"></span></button>
        </div>
      </header>

      <main id="view" class="mx-auto w-full max-w-[1100px] px-4 pt-4 pb-28 md:px-8 md:pt-8 md:pb-12"></main>
    </div>

    <!-- Abas de baixo (celular) -->
    <nav class="fixed inset-x-0 bottom-0 z-40 flex border-t border-line md:hidden" style="background:rgba(18,18,20,.94);backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom)" id="tab-bar"></nav>
  </div>

  <!-- Folhas (adicionar, compartilhar, menu da categoria) -->
  <div id="sheet-backdrop" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/60 md:items-center" data-close></div>

  <script>
    const SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML

    // ============================== dados de exemplo ==============================
    const photo = (seed, w = 480, h = 600) => `https://picsum.photos/seed/vb-${seed}/${w}/${h}`
    const ME = {
      id: "marina", name: "Marina Costa", user: "marina", color: "#b98cc2",
      bio: "Catalogo restaurantes, cafés e filmes desde 2019. Sempre atrás de um lugar novo em SP. 🍜🎬",
      links: [["instagram", "@marina.come"], ["music", "marina"]],
    }
    const PEOPLE = {
      ana: { name: "Ana Ribeiro", user: "ana.ribeiro", color: "#8fc9a6", friend: true, compat: 91, common: 6, bio: "Comida japonesa e livros de terror. Se tem lámen, eu fui.", banner: "ana-banner" },
      pedro: { name: "Pedro Lemos", user: "pedro.le", color: "#8fb3c9", friend: true, compat: 78, common: 3 },
      lucas: { name: "Lucas Prado", user: "lucas", color: "#d6c08a", friend: true, compat: 87, common: 4 },
      bia: { name: "Bia Nunes", user: "bia_games", color: "#d08585", friend: false, common: 2 },
      rafa: { name: "Rafa Souza", user: "rafa", color: "#c79bd0", friend: false, common: 5 },
      joana: { name: "Joana Lima", user: "joana", color: "#9a9aa4", friend: false, common: 4 },
    }
    const FOLDERS = [
      { id: "comes", name: "Comes e bebes", parent: null, vis: "friends" },
      { id: "cultura", name: "Cultura pop", parent: null },
      { id: "roles", name: "Rolês em SP", parent: null, vis: "friends" },
      { id: "viagens", name: "Viagens", parent: null, vis: "private" },
      { id: "bebidas", name: "Bebidas", parent: "comes" },
    ]
    const CATS = [
      { id: "restaurantes", icon: "🍽️", name: "Restaurantes", folder: "comes", count: 15, fav: true, seeds: ["ceviche", "yoshi", "nonna", "norte"] },
      { id: "japoneses", icon: "🍣", name: "Restaurantes japoneses", folder: "comes", count: 6, seeds: ["sapporo", "lamen", "izakaya", "udon"] },
      { id: "caipirinhas", icon: "🍹", name: "Caipirinhas", folder: "bebidas", count: 11, seeds: ["caju", "kiwi", "lichia", "limao"] },
      { id: "filmes", icon: "🎬", name: "Filmes", folder: "cultura", count: 28, fav: true, seeds: ["parasita", "chihiro", "matrix", "duna"] },
      { id: "manga", icon: "📖", name: "Mangá", folder: "cultura", count: 15, fav: true, seeds: ["berserk", "vagabond", "frieren", "dandadan"] },
      { id: "series", icon: "🍿", name: "Séries", folder: "cultura", count: 13, seeds: ["dark", "arcane", "succession", "office"] },
      { id: "cafes", icon: "☕", name: "Cafés", folder: "roles", count: 10, seeds: ["torra", "grao", "biblioteca", "coado"] },
      { id: "bares", icon: "🍸", name: "Bares", folder: "roles", count: 8, seeds: ["samba", "harmonia", "karaoke", "beco"] },
      { id: "cidades", icon: "✈️", name: "Cidades visitadas", folder: "viagens", count: 9, seeds: ["lisboa", "ouropreto", "rio", "salvador"] },
      { id: "hamburgueres", icon: "🍔", name: "Hambúrgueres", folder: null, count: 7, vis: "public", seeds: ["brasa", "smash", "norte-b", "duplo"] },
      { id: "quero", icon: "📍", name: "Quero conhecer em SP", folder: null, count: 11, vis: "private", seeds: ["masp", "pina", "japan", "mercado"] },
    ]
    const ITEMS = [
      { name: "Ceviche Lima", rating: 5, sub: "Peruana · Itaim Bibi", seed: "ceviche", tags: ["Quero voltar"] },
      { name: "Yoshi", rating: 5, sub: "Japonesa · Vila Sônia", seed: "yoshi", tags: ["Japão"] },
      { name: "Cantina Bella Nonna", rating: 4.5, sub: "Italiana · Bela Vista", seed: "nonna", tags: ["Encontro"] },
      { name: "Sabor do Norte", rating: 4.5, sub: "Brasileira · Pinheiros", seed: "norte", tags: [] },
      { name: "Verde Que Te Quero", rating: 4.5, sub: "Vegetariana · Vila Madalena", seed: "verde", tags: ["Barato"] },
      { name: "Peppino Cantina", rating: 4, sub: "Italiana · Itaim Bibi", seed: "peppino", tags: [] },
      { name: "Taquería Los Primos", rating: 4, sub: "Mexicana · Consolação", seed: "taqueria", tags: [] },
      { name: "Prato Feito do Zé", rating: 3, sub: "Brasileira · Liberdade", seed: "pf", tags: ["Barato"] },
    ]
    const TAG_COLORS = { "Quero voltar": "#8fc9a6", Barato: "#d6c08a", Encontro: "#b98cc2", Japão: "#c79bd0" }
    const FEED = [
      { type: "added", who: "ana", when: "há 2 h", cat: ["🍣", "Restaurantes japoneses"], items: [["Lámen do Bairro", 5, "lamen"], ["Izakaya Hoshi", 4.5, "izakaya"], ["Udon Yama", 4, "udon"]] },
      { type: "rated", who: "pedro", when: "há 5 h", cat: ["📚", "Livros"], item: ["Torto Arado", 5, "torto"], note: "Terminei chorando. Leiam." },
      { type: "match", who: "lucas", when: "ontem", compat: 87, common: 4, suggestions: ["Tangerina com Pimenta", "Colorado Appia", "Kiwi"] },
      { type: "newcat", who: "bia", when: "ontem", cat: ["🎮", "Jogos que zerei"], count: 64, top: [["Hades", 5], ["Celeste", 5], ["Hollow Knight", 4.5]], seeds: ["hades", "celeste", "hollow"] },
      { type: "rated", who: "rafa", when: "há 2 dias", cat: ["✈️", "Cidades visitadas"], item: ["Lisboa", 5, "lisboa"], note: "Pastel de nata todo dia. Sem arrependimentos." },
    ]
    const EXPLORE = [
      ["🍣", "Restaurantes japoneses", "joana", 23, ["sapporo", "lamen", "izakaya"]],
      ["📚", "Livros de 2026", "pedro", 31, ["torto", "cem", "1984"]],
      ["🍹", "Caipirinhas da vida", "lucas", 12, ["caju", "kiwi", "lichia"]],
      ["🎮", "Jogos que zerei", "bia", 64, ["hades", "celeste", "hollow"]],
      ["☕", "Cafés para trabalhar", "rafa", 40, ["torra", "grao", "coado"]],
      ["✈️", "Cidades visitadas", "rafa", 18, ["lisboa", "ouropreto", "baires"]],
    ]

    // O que mudou em cada tela (o painel "O que mudou aqui").
    const NOTES = {
      geral: [
        "<b>5 lugares em vez de 13 caminhos:</b> Início, Descobrir, ＋ Adicionar, Match e Perfil. No celular, viram as abas de baixo.",
        "Saem da barra: Coleções, Filtro, Mapa, Tags, Favoritos e Pessoas — cada um foi para dentro de um dos 5 lugares.",
        "Tudo da conta fica num lugar só: <b>Configurações</b> (no ⚙ do perfil). O que aparece no perfil fica em <b>Editar perfil</b>.",
      ],
      inicio: [
        "<span class='new-badge'>novo</span> O <b>Início</b> é o coração da rede: o que os amigos acabaram de catalogar, avaliar e criar.",
        "<b>Trazer</b> em um toque direto do feed (já existe no Match; aqui vale para tudo de amigos).",
        "O “Você está em…?” virou o primeiro card do Início.",
        "As bolinhas no topo são quem tem novidade — um toque abre o perfil.",
      ],
      descobrir: [
        "<b>Explorar + Pessoas</b> viram uma tela só, com <b>uma busca</b> para pessoas, categorias e itens.",
        "<b>Temas</b> (chips) substituem o Filtro geral e a página de Tags como entrada de navegação.",
        "Cada categoria mostra fotos dos itens: dá vontade de abrir.",
      ],
      match: [
        "<b>Match</b> sobe para a navegação principal (antes estava escondido no menu da foto).",
        "Convite pendente aparece em cima, com Aceitar em um toque.",
      ],
      "match-lucas": ["A % fica grande e as três listas (para você, em comum, para ele) viram abas."],
      perfil: [
        "<b>Perfil = cartão + Coleções + Favoritas + Mapa</b>, em abas (antes eram 4 telas: Meu perfil, Coleções, Favoritos e Mapa).",
        "No topo, só 3 ações: <b>Editar perfil</b>, <b>Compartilhar</b> (QR, link e story juntos) e <b>⚙ Configurações</b>.",
        "Categoria ganha capa com as fotos dos itens. Os botões de editar/excluir saem dos cards (vão para dentro da categoria).",
        "A Lixeira sai da tela principal: Configurações → Seus dados.",
        "<b>Filtros</b> ao lado da busca é o antigo <b>Filtro geral</b>: nota, tags e campos como Bairro e Preço, em todas as categorias de uma vez. O resultado mostra os itens com a categoria de cada um.",
        "<b>Tags</b>: viram filtro (no Filtros) e etiqueta no item; gerenciar fica em Configurações → Suas tags.",
      ],
      "pessoa-ana": ["No perfil de outra pessoa: <b>Seguir/Amigos</b> e <b>Fazer match</b> lado a lado, e a % de compatibilidade à vista."],
      categoria: [
        "O topo cai de <b>7 botões para 2</b>: <b>＋ Item</b> e <b>⋯</b> (Estrutura, Nova subpasta, Ver no mapa, Excluir…).",
        "Visibilidade vira um chip ao lado do nome (🌐 Pública ▾); a estrela fica junto do título.",
        "Nota mínima/máxima, ordem e tags vão para um botão <b>Filtros</b>.",
        "Subpastas viram chips numa linha, em vez de cards grandes que empurram os itens para baixo.",
      ],
      item: [
        "<span class='new-badge'>novo</span> “Quem também tem”: amigos com o mesmo item e a nota deles.",
        "Editar, mover e excluir ficam no ⋯; no item de outra pessoa, o botão principal é <b>Trazer</b>.",
      ],
      avisos: ["Avisos ganham ações no próprio aviso (Seguir de volta, Aceitar match), sem abrir outra tela."],
      config: [
        "<b>Uma lista só</b>, em grupos: Conta, Privacidade, Apps e importação, Seus dados, Sobre.",
        "Importar, Steam, Letterboxd e Backup ficam juntos em <b>Apps e importação</b> (antes: Importar, Editar cartão e Configurações).",
      ],
      editar: ["Tudo que aparece no perfil numa tela: banner, foto, nome, bio, redes e destaques (antes misturado com Steam/Letterboxd)."],
    }

    // ============================== peças ==============================
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
    const fmt = (n) => String(n).replace(".", ",")
    const ic = (name, cls = "size-4") => `<i data-lucide="${name}" class="${cls}"></i>`
    const person = (id) => (id === "marina" ? ME : PEOPLE[id])
    const avatar = (id, size = 40, extra = "") => {
      const p = person(id)
      return `<span class="avatar ${extra}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.44)}px;background:color-mix(in srgb,${p.color} 22%,var(--color-surface-hi));color:${p.color}">${esc(p.name[0])}</span>`
    }
    const stars = (r, size = ".75rem") => `
      <span class="relative inline-block leading-none whitespace-nowrap" style="font-size:${size}">
        <span class="block text-line-hi" style="letter-spacing:.1em">★★★★★</span>
        <span class="absolute inset-y-0 left-0 overflow-hidden text-brand" style="width:${(r / 5) * 100}%"><span class="block" style="letter-spacing:.1em">★★★★★</span></span>
      </span>`
    const ratingPill = (r) => `<span class="inline-flex items-center gap-1 rounded-md bg-bg/85 px-1.5 py-0.5 text-xs backdrop-blur-sm"><span class="text-brand">★</span>${fmt(r)}</span>`
    const visIcon = (vis) => (vis === "private" ? ic("lock", "size-3.5 text-faint") : vis === "friends" ? ic("users", "size-3.5 text-faint") : "")
    const tagPill = (t) => {
      const c = TAG_COLORS[t] ?? "#b98cc2"
      return `<span class="inline-flex items-center gap-1.5 rounded-full border px-2 py-0.5 text-xs" style="border-color:${c}55;color:${c}"><span class="size-1.5 rounded-full" style="background:${c}"></span>${esc(t)}</span>`
    }
    const header = (title, sub = "", right = "") => `
      <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
        <div class="min-w-0"><h1 class="display text-3xl leading-tight md:text-4xl">${title}</h1>${sub ? `<p class="mt-1 text-sm text-muted-foreground">${sub}</p>` : ""}</div>
        ${right}

        </div>`,
      "menu-categoria": () => menuSheet("Restaurantes", [["sliders-horizontal", "Estrutura e campos"], ["folder-plus", "Nova subpasta"], ["globe", "Quem vê: Pública"], ["map", "Ver no mapa"], ["trash-2", "Excluir categoria", "text-danger"]]),
      "menu-item": () => menuSheet("Ceviche Lima", [["pencil", "Editar"], ["folder-input", "Levar para outra categoria"], ["share-2", "Compartilhar"], ["trash-2", "Excluir", "text-danger"]]),
    }
    function menuSheet(title, rows) {
      return `<h2 class="display mb-4 text-2xl">${esc(title)}</h2>
        <div class="card divide-y divide-line overflow-hidden">${rows.map(([icon, label, cls = ""]) => `<button class="flex w-full items-center gap-3 px-4 py-3.5 text-left text-sm hover:bg-surface-hi ${cls}">${ic(icon, "size-5")}${label}</button>`).join("")}</div>`
    }
    function qrSvg() {
      const n = 25, cell = 6
      let seed = 7
      const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280)
      const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7)
      let rects = ""
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        let on
        if (finder(x, y)) {
          const fx = x >= n - 7 ? x - (n - 7) : x, fy = y >= n - 7 ? y - (n - 7) : y
          on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4)
        } else on = rnd() > 0.52
        if (on) rects += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}"/>`
      }
      return `<svg width="${n * cell}" height="${n * cell}" viewBox="0 0 ${n * cell} ${n * cell}" fill="#131315" aria-label="QR do perfil">${rects}</svg>`
    }

    // ============================== navegação ==============================
    const NAV = [["inicio", "house", "Início"], ["descobrir", "compass", "Descobrir"], ["match", "heart-handshake", "Match"], ["avisos", "bell", "Avisos"], ["perfil", null, "Perfil"]]
    document.getElementById("side-nav").innerHTML = NAV.map(([id, icon, label]) => `
      <a data-go="${id}" data-nav="${id}" class="nav-item">
        <span class="relative flex size-6 items-center justify-center">${icon ? ic(icon, "size-5") : avatar("marina", 26)}${id === "avisos" ? '<span class="absolute -top-0.5 -right-0.5 size-2 rounded-full bg-brand"></span>' : ""}</span>
        <span class="hidden lg:inline">${label}</span>
      </a>`).join("")
    document.getElementById("tab-bar").innerHTML = [
      ["inicio", "house", "Início"], ["descobrir", "compass", "Descobrir"], ["+", "plus", ""], ["match", "heart-handshake", "Match"], ["perfil", null, "Perfil"],
    ].map(([id, icon, label]) => id === "+"
      ? `<button data-sheet="adicionar" class="tabbar-item"><span class="flex size-11 items-center justify-center rounded-2xl bg-brand text-on-brand shadow-lg">${ic("plus", "size-6")}</span></button>`
      : `<a data-go="${id}" data-nav="${id}" class="tabbar-item">${icon ? ic(icon, "size-6") : avatar("marina", 26)}<span>${label}</span></a>`).join("")

    const inFrame = window.self !== window.top
    const app = document.getElementById("app")
    const view = document.getElementById("view")
    const phone = document.getElementById("phone")
    const phoneWrap = document.getElementById("phone-wrap")
    const select = document.getElementById("screen-select")
    let device = "desktop"
    let current = "inicio"

    // Qual item da navegação fica aceso em cada tela.
    const NAV_OF = { "match-lucas": "match", "pessoa-ana": "descobrir", categoria: "perfil", item: "perfil", editar: "perfil", config: "config" }

    function render() {
      view.innerHTML = SCREENS[current]()
      const nav = NAV_OF[current] ?? current
      document.querySelectorAll("[data-nav]").forEach((a) => a.setAttribute("aria-current", String(a.dataset.nav === nav)))
      lucide.createIcons()
    }

    function show(id) {
      if (!SCREENS[id]) id = "inicio"
      if (id !== current && (id === "perfil" || id === "pessoa-ana")) { profileTab = "colecoes"; folderOpen = null; filtersOn = false }
      current = id
      if (select) select.value = id
      render()
      renderNotes()
      app.hidden = device === "mobile" && !inFrame
      if (device === "mobile" && !inFrame) {
        if (!phone.srcdoc) { phone.onload = () => phone.contentWindow.postMessage(current, "*"); phone.srcdoc = SOURCE }
        else phone.contentWindow.postMessage(id, "*")
      }
      if (!inFrame) { try { history.replaceState(null, "", `#${id}`) } catch {} }
      window.scrollTo(0, 0)
    }

    function renderNotes() {
      const box = document.querySelector("#notes > div")
      if (!box) return
      const list = [...(NOTES[current] ?? []), ...(current === "inicio" ? NOTES.geral : [])]
      box.innerHTML = `<ul class="list-disc space-y-1 pl-5">${list.map((n) => `<li>${n}</li>`).join("")}</ul>`
    }

    const backdrop = document.getElementById("sheet-backdrop")
    function openSheet(name) {
      backdrop.innerHTML = `
        <div class="max-h-[88dvh] w-full overflow-y-auto rounded-t-3xl border border-line bg-bg p-5 pb-8 md:max-w-lg md:rounded-3xl">
          <div class="mx-auto mb-4 h-1 w-10 rounded-full bg-line-hi md:hidden"></div>
          ${SHEETS[name]()}
        </div>`
      backdrop.classList.remove("hidden"); backdrop.classList.add("flex")
      lucide.createIcons()
    }
    function closeSheet() { backdrop.classList.add("hidden"); backdrop.classList.remove("flex") }

    document.addEventListener("click", (e) => {
      const t = e.target
      if (t === backdrop) return closeSheet()
      const star = t.closest("[data-star]")
      if (star) {
        e.preventDefault(); e.stopPropagation()
        const on = star.getAttribute("aria-pressed") !== "true"
        star.setAttribute("aria-pressed", String(on))
        star.classList.toggle("text-brand", on); star.classList.toggle("text-ink/70", !on)
        star.querySelector("svg")?.classList.toggle("fill-current", on)
        return
      }
      const bringBtn = t.closest("[data-bring]")
      if (bringBtn) { e.stopPropagation(); bringBtn.innerHTML = `${ic("check")} Na sua A organizar`; bringBtn.disabled = true; lucide.createIcons(); return }
      const fol = t.closest("[data-follow]")
      if (fol) {
        e.stopPropagation()
        const on = fol.getAttribute("aria-pressed") !== "true"
        fol.setAttribute("aria-pressed", String(on))
        fol.className = `btn btn-sm ${on ? "btn-soft" : "btn-primary"}`
        fol.innerHTML = on ? `${ic("user-check")} Seguindo` : `${ic("user-plus")} Seguir`
        lucide.createIcons(); return
      }
      const pick = t.closest("[data-pick]")
      if (pick) return pick.setAttribute("aria-pressed", String(pick.getAttribute("aria-pressed") !== "true"))
      if (t.closest("[data-apply-filters]")) {
        if (current === "perfil") { filtersOn = true; profileTab = "colecoes"; folderOpen = null }
        closeSheet(); return render()
      }
      if (t.closest("[data-clear-filters]")) { filtersOn = false; closeSheet(); return render() }
      const sheet = t.closest("[data-sheet]")?.dataset.sheet
      if (sheet) { e.preventDefault(); return openSheet(sheet) }
      const ptab = t.closest("[data-ptab]")?.dataset.ptab
      if (ptab) { profileTab = ptab; folderOpen = null; return render() }
      const ctab = t.closest("[data-ctab]")?.dataset.ctab
      if (ctab) { categoryTab = ctab; return render() }
      const folder = t.closest("[data-folder]")
      if (folder) { folderOpen = folder.dataset.folder || null; return render() }
      const cview = t.closest("[data-cview]")?.dataset.cview
      if (cview) {
        document.querySelectorAll("[data-cview]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cview === cview)))
        document.getElementById("cat-grid").classList.toggle("hidden", cview !== "grid")
        const list = document.getElementById("cat-list")
        list.classList.toggle("hidden", cview !== "list"); list.classList.toggle("flex", cview === "list")
        return
      }
      const go = t.closest("[data-go]")?.dataset.go
      if (go) { e.preventDefault(); closeSheet(); return show(go) }
      const dev = t.closest("[data-device]")?.dataset.device
      if (dev) {
        device = dev
        document.querySelectorAll("[data-device]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.device === dev)))
        phoneWrap.classList.toggle("hidden", dev !== "mobile"); phoneWrap.classList.toggle("flex", dev === "mobile")
        show(current)
      }
    })
    document.addEventListener("keydown", (e) => e.key === "Escape" && closeSheet())
    select?.addEventListener("change", () => show(select.value))
    document.getElementById("notes-toggle")?.addEventListener("click", () => document.getElementById("notes").classList.toggle("hidden"))

    if (inFrame) {
      document.getElementById("proto-bar").remove()
      window.addEventListener("message", (e) => typeof e.data === "string" && show(e.data))
    }
    show(location.hash.slice(1) || "inicio")
  </script>
</body>
</html>
